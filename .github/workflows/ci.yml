name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: core · typecheck, tests, red team
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      # Offline and deterministic: needs no keys. Fails the build if any attack gets through.
      - run: bun run redteam

  web:
    name: web · build, typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # The console imports the wire contract from ../src, which resolves zod from the repo root.
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run typecheck
