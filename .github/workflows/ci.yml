name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: core · typecheck, tests, red team, mutation check, offline smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # A known advisory in a dependency fails the build, instead of scrolling past as a build warning.
      - run: bun audit
      - run: bun run typecheck
      - run: bun test
      # Offline and deterministic: needs no keys. Fails the build if any attack gets through.
      - run: bun run redteam
      # Removes each guard from a private copy and fails unless the red team or a named test notices. Offline, about 15 s.
      - run: bun run mutate
      # The offline demo end to end in-process: seed, scripted agent run, invariant and hash chain.
      - run: bun run scripts/offline-smoke.ts

  web:
    name: web · build, typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # The console imports the wire contract from ../src, which resolves zod from the repo root.
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bun run build
      - run: bun run typecheck

  docker:
    name: docker · the offline demo image builds and serves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tessera-demo .
      # The image is the public demo: no keys, simulated Airwallex. It must come up and render the console.
      - run: |
          docker run -d --name demo -p 3100:3100 -e TESSERA_ALLOWED_HOSTS=localhost tessera-demo
          for i in $(seq 1 60); do curl -fsS http://localhost:3100/ >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS http://localhost:3100/ | grep -q "Tessera"
          docker logs demo 2>&1 | tail -20
